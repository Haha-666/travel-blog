<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的雲端旅遊部落格</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-50 font-sans">

    <div id="app">
        <header class="bg-slate-900 p-6 text-white flex justify-between items-center shadow-lg sticky top-0 z-50">
            <h1 @click="currentMode = 'list'" class="text-2xl font-bold tracking-tight cursor-pointer hover:text-blue-400 transition">
                🌍 旅遊部落格
            </h1>
            
            <div class="flex items-center gap-4">
                <div v-if="user" class="flex items-center gap-4">
                    <div @click="currentMode = 'profile'" class="flex items-center gap-2 cursor-pointer hover:text-blue-400 transition border-r border-slate-700 pr-4">
                        <span class="text-sm font-medium">👤 {{ customProfile.displayName || user.displayName }}</span>
                    </div>
                    <button @click="goToForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-500 transition shadow-md">+ 新增文章</button>
                    <button @click="logout" class="text-slate-400 hover:text-white text-sm underline">登出</button>
                </div>
                <button v-else @click="login" class="bg-white text-slate-900 px-6 py-2 rounded-lg font-bold hover:bg-slate-200 transition">Google 登入</button>
            </div>
        </header>

        <main class="min-h-screen p-4 md:p-8">
            <div v-if="currentMode === 'list'" class="max-w-5xl mx-auto">
                <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200 p-6">
                    <div class="mb-6">
                        <input v-model="searchQuery" type="text" placeholder="🔍 搜尋標題..." class="w-full border border-slate-200 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <div class="overflow-x-auto border border-slate-100 rounded-lg">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 border-b text-slate-500 text-sm uppercase font-semibold">
                                <tr>
                                    <th class="p-4">文章標題</th>
                                    <th class="p-4">最後更新</th>
                                    <th class="p-4">操作</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                <tr v-for="post in filteredPosts" :key="post.id" @click="goToDetail(post)" class="hover:bg-blue-50/50 cursor-pointer transition">
                                    <td class="p-4">
                                        <div class="font-bold text-blue-600 underline">{{ post.title }}</div>
                                        <div class="text-xs text-slate-400">作者: {{ post.authorName }}</div>
                                    </td>
                                    <td class="p-4 text-slate-400 text-sm">{{ post.updatedAt }}</td>
                                    <td class="p-4" @click.stop>
                                        <div v-if="canEdit(post)" class="flex gap-3">
                                            <button @click="goToForm(post)" class="text-slate-500 hover:text-blue-600 text-sm font-semibold">編輯</button>
                                            <button @click="deletePost(post.id)" class="text-red-400 hover:text-red-600 text-sm font-semibold">刪除</button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div v-else-if="currentMode === 'profile'" class="max-w-4xl mx-auto space-y-8">
                <button @click="currentMode = 'list'" class="text-blue-600 font-semibold flex items-center gap-1">← 返回清單</button>
                
                <div class="bg-white shadow-xl rounded-2xl p-8 border">
                    <h2 class="text-xl font-bold mb-6 text-slate-800 border-b pb-2">個人帳號設定</h2>
                    <div class="flex flex-col md:flex-row gap-4 items-end">
                        <div class="flex-1 w-full">
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">更改顯示姓名</label>
                            <input v-model="tempProfile.displayName" class="w-full border-2 border-slate-100 rounded-lg px-4 py-2 text-lg focus:border-blue-500 outline-none transition" />
                        </div>
                        <button @click="saveProfile" class="bg-slate-800 text-white px-8 py-2.5 rounded-lg font-bold hover:bg-slate-700 transition">儲存姓名</button>
                    </div>
                    <p class="text-xs text-slate-400 mt-4">註冊信箱：{{ user.email }}</p>
                </div>

                <div class="bg-white shadow-xl rounded-2xl p-8 border">
                    <h2 class="text-xl font-bold mb-6 text-slate-800 border-b pb-2">我發布的文章 ({{ myPosts.length }})</h2>
                    <div v-if="myPosts.length === 0" class="text-center py-10 text-slate-400">
                        目前還沒有發布過文章喔！
                    </div>
                    <div v-else class="space-y-4">
                        <div v-for="post in myPosts" :key="post.id" class="flex justify-between items-center p-4 bg-slate-50 rounded-xl hover:bg-slate-100 transition border border-slate-100">
                            <div>
                                <h3 class="font-bold text-slate-700">{{ post.title }}</h3>
                                <p class="text-xs text-slate-400">更新日期：{{ post.updatedAt }}</p>
                            </div>
                            <div class="flex gap-4">
                                <button @click="goToForm(post)" class="text-blue-600 hover:underline font-medium">編輯</button>
                                <button @click="deletePost(post.id)" class="text-red-500 hover:underline font-medium">刪除</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div v-else-if="currentMode === 'form'" class="max-w-3xl mx-auto bg-white shadow-2xl rounded-2xl border">
                <div class="p-6 bg-slate-900 text-white flex justify-between items
