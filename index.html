<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的雲端旅遊部落格</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-50 font-sans">

    <div id="app">
        <header class="bg-slate-900 p-6 text-white flex justify-between items-center shadow-lg">
            <h1 class="text-2xl font-bold tracking-tight">🌍 旅遊部落格</h1>
            <div class="flex items-center gap-4">
                <div v-if="user" class="flex items-center gap-3">
                    <span class="hidden md:block text-slate-300">{{ user.displayName }}</span>
                    <img :src="user.photoURL" class="w-10 h-10 rounded-full border-2 border-blue-500 shadow-sm" />
                    <button @click="logout" class="text-sm text-slate-400 hover:text-white">登出</button>
                    <button @click="goToForm()" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-bold">+ 新增文章</button>
                </div>
                <button v-else @click="login" class="bg-white text-slate-900 px-6 py-2 rounded-lg font-bold hover:bg-slate-200 transition">
                    Google 登入
                </button>
            </div>
        </header>

        <div class="min-h-screen p-4 md:p-8">
            <div v-if="currentMode === 'list'" class="max-w-5xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200">
                <div class="p-6">
                    <div class="mb-6 relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">🔍</span>
                        <input v-model="searchQuery" type="text" placeholder="搜尋標題..." class="w-full border border-slate-200 rounded-lg pl-10 pr-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <div class="overflow-x-auto border border-slate-100 rounded-lg">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="bg-slate-50 border-b text-slate-500 text-sm uppercase font-semibold">
                                    <th class="p-4">編號</th>
                                    <th class="p-4">文章標題</th>
                                    <th class="p-4">操作</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                <tr v-for="(post, index) in paginatedPosts" :key="post.id" @click="goToDetail(post)" class="hover:bg-blue-50/50 cursor-pointer transition">
                                    <td class="p-4 text-slate-400">#{{ post.id }}</td>
                                    <td class="p-4 font-bold text-blue-600 underline">{{ post.title }}</td>
                                    <td class="p-4" @click.stop>
                                        <button @click="goToForm(post)" class="text-slate-500 mr-3">編輯</button>
                                        <button @click="deletePost(post.id)" class="text-red-400">刪除</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div v-else-if="currentMode === 'detail'" class="max-w-4xl mx-auto">
                <button @click="currentMode = 'list'" class="mb-4 text-blue-600 font-semibold">← 返回列表</button>
                <article class="bg-white shadow-2xl rounded-2xl overflow-hidden border">
                    <header class="bg-slate-900 p-8 text-white"><h1 class="text-3xl font-bold">{{ currentPost.title }}</h1></header>
                    <div class="p-8 md:p-12"><p class="text-slate-700 leading-relaxed text-lg whitespace-pre-wrap">{{ currentPost.body }}</p></div>
                </article>
            </div>

            <div v-else-if="currentMode === 'form'" class="max-w-3xl mx-auto bg-white shadow-2xl rounded-2xl border">
                <div class="p-6 bg-slate-900 text-white flex justify-between">
                    <h2 class="text-xl font-bold">{{ isEditing ? '📝 編輯' : '✨ 新增' }}</h2>
                    <button @click="currentMode = 'list'">&times;</button>
                </div>
                <div class="p-8 space-y-6">
                    <input v-model="currentPost.title" class="w-full border rounded-xl px-4 py-3" placeholder="標題" />
                    <textarea v-model="currentPost.body" rows="10" class="w-full border rounded-xl px-4 py-3" placeholder="內容"></textarea>
                    <div class="flex justify-end gap-4">
                        <button @click="currentMode = 'list'">取消</button>
                        <button @click="savePost" class="bg-blue-600 text-white px-10 py-2 rounded-xl font-bold">發佈</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // 引入 Firebase 模組
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 這裡使用的是你剛才提供的 Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyDHRvhpl6ExX0EL-K6ha2S7X89PtdQkitI",
            authDomain: "my-travel-blog-1af19.firebaseapp.com",
            projectId: "my-travel-blog-1af19",
            storageBucket: "my-travel-blog-1af19.firebasestorage.app",
            messagingSenderId: "663043964518",
            appId: "1:663043964518:web:4d8fad3fd2f2eba7bfb7a7"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const provider = new GoogleAuthProvider();

        const { createApp, ref, computed, onMounted, watch } = Vue;

        createApp({
            setup() {
                const user = ref(null);
                const DB_KEY = 'VUE_APP_POSTS';
                const posts = ref([{ id: 1, title: "歡迎來到我的部落格", body: "這是一個測試文章。" }]);
                const currentMode = ref('list');
                const searchQuery = ref('');
                const currentPage = ref(1);
                const pageSize = 5;
                const isEditing = ref(false);
                const currentPost = ref({ id: null, title: '', body: '' });

                onMounted(() => {
                    // 監聽 Firebase 登入狀態
                    onAuthStateChanged(auth, (currentUser) => {
                        user.value = currentUser;
                    });
                    const saved = localStorage.getItem(DB_KEY);
                    if (saved) posts.value = JSON.parse(saved);
                });

                watch(posts, (newVal) => localStorage.setItem(DB_KEY, JSON.stringify(newVal)), { deep: true });

                const login = async () => {
                    try {
                        await signInWithPopup(auth, provider);
                    } catch (err) {
                        console.error("登入出錯:", err);
                        alert("登入失敗，請檢查網域授權！");
                    }
                };

                const logout = () => signOut(auth);

                const goToDetail = (post) => {
                    currentPost.value = { ...post };
                    currentMode.value = 'detail';
                };

                const goToForm = (post = null) => {
                    if (!user.value) return alert("請先登入才能操作！");
                    if (post) {
                        isEditing.value = true;
                        currentPost.value = { ...post };
                    } else {
                        isEditing.value = false;
                        currentPost.value = { id: null, title: '', body: '' };
                    }
                    currentMode.value = 'form';
                };

                const savePost = () => {
                    if (!currentPost.value.title.trim()) return;
                    if (isEditing.value) {
                        const idx = posts.value.findIndex(p => p.id === currentPost.value.id);
                        posts.value[idx] = { ...currentPost.value };
                    } else {
                        const newId = posts.value.length > 0 ? Math.max(...posts.value.map(p => p.id)) + 1 : 1;
                        posts.value.unshift({ ...currentPost.value, id: newId });
                    }
                    currentMode.value = 'list';
                };

                const deletePost = (id) => {
                    if (!user.value) return alert("請先登入！");
                    if (confirm('確定刪除？')) posts.value = posts.value.filter(p => p.id !== id);
                };

                const filteredPosts = computed(() => {
                    return posts.value.filter(p => p.title.toLowerCase().includes(searchQuery.value.toLowerCase()));
                });

                const paginatedPosts = computed(() => {
                    const start = (currentPage.value - 1) * pageSize;
                    return filteredPosts.value.slice(start, start + pageSize);
                });

                return {
                    user, login, logout, posts, currentMode, searchQuery, currentPage, 
                    isEditing, currentPost, goToDetail, goToForm, savePost, deletePost, 
                    filteredPosts, paginatedPosts
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
